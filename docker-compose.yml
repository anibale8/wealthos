version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/wealthos.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=development
    depends_on: []

  ml-worker:
    build:
      context: ./ml
      dockerfile: Dockerfile
    volumes:
      - ./ml:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/wealthos.db
    profiles:
      - ml  # only starts with: docker compose --profile ml up

volumes:
  data:
